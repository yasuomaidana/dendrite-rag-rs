[package]
name = "dendrite-rag"
description = "Dendrite's retrieval sidecar: JSON-RPC over stdio and a CLI on loom-rag, with `.dendrite/rag.toml` settings and Dendrite's `ask` prompts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage = "https://github.com/yasuomaidana/dendrite-rag-rs"
documentation = "https://docs.rs/dendrite-rag"
keywords = ["rag","json-rpc","code-search","cli","llm"]
categories = ["development-tools","command-line-utilities"]

[lib]
name = "dendrite_rag"

[[bin]]
name = "dendrite-rag"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1.8.7"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
loom-rag = { path = "../loom-rag", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "display", "serde"] }

[dev-dependencies]
loom-rag = { path = "../loom-rag", version = "0.1.0", features = ["testutil"] }
libc = "0.2.191"
tempfile = "3.27.0"
rstest = "0.28.0"

[features]
default = []
postgres = ["loom-rag/postgres"]
sqlite = ["loom-rag/sqlite"]
hnsw = ["loom-rag/hnsw"]
model2vec = ["loom-rag/model2vec"]
candle = ["loom-rag/candle"]
candle-metal = ["loom-rag/candle-metal"]
candle-cuda = ["loom-rag/candle-cuda"]
candle-accelerate = ["loom-rag/candle-accelerate"]
oxillama = ["loom-rag/oxillama"]
