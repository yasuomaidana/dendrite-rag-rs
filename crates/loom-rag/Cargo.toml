[package]
name = "loom-rag"
description = "Retrieval engine for code and documentation: syntax-aware chunking, code-aware BM25, dense vectors, symbol graph, weighted RRF fusion and token-budgeted context packs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "loom_rag"

[dependencies]
anyhow = "1"
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
hf-hub = { version = "1.0.0", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
tokenizers = { version = "1.0.0-rc.3", default-features = false, features = ["regex", "normalizers", "bpe", "wordpiece", "unigram", "wordlevel", "unicode-scripts", "parallelism"], optional = true }
oxillama-runtime = { version = "0.1.4", default-features = false, features = ["qwen3", "llama", "gemma", "mistral", "phi", "tokenizer-wasm", "parallel", "mmap"], optional = true }
blake3 = "1.8.7"
embedag = { git = "https://github.com/yasuomaidana/embedag", branch = "develop", version = "0.1.0", default-features = false, features = ["core"] }
globset = "0.4.20"
ignore = "0.4.33"
lru = "0.19.0"
pgvector = { version = "0.4.2", features = ["postgres"], optional = true }
postgres = { version = "0.19.14", features = ["with-serde_json-1"], optional = true }
model2vec-rs = { version = "0.3.0", default-features = false, features = ["fancy-regex", "hf-hub"], optional = true }
rayon = "1.12.0"
redb = "4.4.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
streaming-iterator = "0.1.9"
tantivy = "0.27.0"
thiserror = "2.0.21"
tree-sitter = "0.27.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
ureq = { version = "3.5.0", features = ["json"] }
tempfile = { version = "3.27.0", optional = true }
dhat = { version = "0.3.3", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
libc = "0.2.191"
tempfile = "3.27.0"
testcontainers = { version = "0.28.0", features = ["blocking"] }

[features]
default = []
# Test fixtures (`loom_rag::testutil`) for crates that build on the engine.
testutil = ["dep:tempfile"]
# Heap profiling for the peak-heap gate (`tests/peak_heap.rs`).
dhat = ["dep:dhat"]
# Shared tier on PostgreSQL 16 + pgvector (`[storage] mode = "remote"`).
postgres = ["dep:postgres", "dep:pgvector"]
# Approximate nearest-neighbour index for large corpora.
hnsw = []
# In-process static embeddings (model2vec), for fully offline indexing.
model2vec = ["dep:model2vec-rs"]
# In-process safetensors encoders (BERT, NomicBERT, JinaBERT) on candle.
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:hf-hub", "dep:tokenizers"]
# candle on the Apple GPU.
candle-metal = ["candle", "candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
# candle on an NVIDIA GPU (needs the CUDA toolkit to build).
candle-cuda = ["candle", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
# candle with Apple Accelerate BLAS on the CPU.
candle-accelerate = ["candle", "candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
# In-process GGUF embedders (Qwen3-Embedding and other decoder models) on OxiLLaMa; needs Rust 1.89.
oxillama = ["dep:oxillama-runtime", "dep:hf-hub"]

[[example]]
name = "vector_bench"
required-features = ["hnsw"]

[[bench]]
name = "retrieval"
harness = false
required-features = ["testutil"]
