[package]
name = "loom-gate"
description = "Quality gates over a source tree for CI and agents: production lines per file today, clone detection next."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "loom-gate"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
loom-rag = { path = "../loom-rag" }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
