[package]
name = "loom-gate"
description = "Quality gates over a source tree for CI and agents: production lines per file today, clone detection next."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage = "https://github.com/yasuomaidana/dendrite-rag-rs"
documentation = "https://docs.rs/loom-gate"
keywords = ["quality","ci","linter","complexity","code-duplication"]
categories = ["development-tools","command-line-utilities"]

[[bin]]
name = "loom-gate"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
loom-rag = { path = "../loom-rag", version = "0.1.0" }

[dev-dependencies]
rstest = "0.28.0"
serde_json = "1.0.154"
tempfile = "3.27.0"
