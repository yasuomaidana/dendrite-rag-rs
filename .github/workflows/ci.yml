name: ci
on:
  push:
    branches: [develop, main]
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  embedders:
    # Each in-process embedder builds and passes its unit tests on its own; live model
    # tests stay behind --ignored.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature: [model2vec, candle, oxillama, hnsw]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.feature }}
      - run: cargo clippy --all-targets --features ${{ matrix.feature }} -- -D warnings
      - run: cargo test --features ${{ matrix.feature }}
  postgres:
    # The shared tier against a real PostgreSQL 16 with pgvector.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: ragtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DENDRITE_RAG_TEST_PG_URL: postgresql://rag:rag@localhost:5432/ragtest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: postgres
      - run: cargo clippy --all-targets --features postgres -- -D warnings
      - run: cargo test --features postgres
