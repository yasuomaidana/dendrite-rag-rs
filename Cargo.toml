[package]
name = "dendrite-rag"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Retrieval engine for source-code repositories: cAST chunking, code-aware BM25, dense vectors, RRF fusion and token-budgeted context packs."
license = "MIT OR Apache-2.0"
repository = "https://github.com/yasuomaidana/dendrite-rag-rs"

[lib]
name = "dendrite_rag"
path = "src/lib.rs"

[[bin]]
name = "dendrite-rag"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4.6", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streaming-iterator = "0.1"
thiserror = "2"
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
tempfile = "3"
