[package]
name = "dendrite-rag"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Retrieval engine for source-code repositories: cAST chunking, code-aware BM25, dense vectors, RRF fusion and token-budgeted context packs."
license = "MIT OR Apache-2.0"
repository = "https://github.com/yasuomaidana/dendrite-rag-rs"

[lib]
name = "dendrite_rag"
path = "src/lib.rs"

[[bin]]
name = "dendrite-rag"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
