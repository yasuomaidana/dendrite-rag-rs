[package]
name = "dendrite-rag"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Retrieval engine for source-code repositories: cAST chunking, code-aware BM25, dense vectors, RRF fusion and token-budgeted context packs."
license = "MIT OR Apache-2.0"
repository = "https://github.com/yasuomaidana/dendrite-rag-rs"

[lib]
name = "dendrite_rag"
path = "src/lib.rs"

[[bin]]
name = "dendrite-rag"
path = "src/main.rs"

[dependencies]
anyhow = "1"
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"], optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"], optional = true }
oxillama-runtime = { version = "0.1.4", default-features = false, features = ["qwen3", "llama", "gemma", "mistral", "phi", "tokenizer-wasm", "parallel", "mmap"], optional = true }
blake3 = "1"
clap = { version = "4.6", features = ["derive"] }
embedag = { git = "https://github.com/yasuomaidana/embedag", branch = "develop", version = "0.1.0", default-features = false, features = ["core"] }
globset = "0.4"
ignore = "0.4"
model2vec-rs = { version = "0.3", default-features = false, features = ["fancy-regex", "hf-hub"], optional = true }
rayon = "1"
redb = "4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streaming-iterator = "0.1"
tantivy = "0.27"
thiserror = "2"
toml = { version = "0.9", default-features = false, features = ["parse", "display", "serde"] }
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
libc = "0.2"
tempfile = "3"

[features]
default = []
# In-process static embeddings (model2vec), for fully offline indexing.
model2vec = ["dep:model2vec-rs"]
# In-process safetensors encoders (BERT, NomicBERT, JinaBERT) on candle.
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:hf-hub", "dep:tokenizers"]
# candle on the Apple GPU.
candle-metal = ["candle", "candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
# candle with Apple Accelerate BLAS on the CPU.
candle-accelerate = ["candle", "candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
# In-process GGUF embedders (Qwen3-Embedding and other decoder models) on OxiLLaMa; needs Rust 1.89.
oxillama = ["dep:oxillama-runtime", "dep:hf-hub"]
